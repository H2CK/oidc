services:
  nextcloud-proxy:
    image: nginx:1.27-alpine
    ports:
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../oauth-tests/certs:/etc/nginx/certs:ro

  oauch:
    build:
      context: .
      args:
        OAUCH_IMAGE: ${OAUCH_IMAGE:-pieterphilippaerts/oauch-image:latest}
    hostname: oauch.io
    ports:
      - "9443:443"
    volumes:
      - ${OAUCH_RESULTS_DIR:-../../oauch-results}/db:/db
    networks:
      default:
        aliases:
          - oauch.io
    depends_on:
      - nextcloud-proxy

  chrome:
    image: selenium/standalone-chromium:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
    depends_on:
      - oauch
      - nextcloud-proxy
